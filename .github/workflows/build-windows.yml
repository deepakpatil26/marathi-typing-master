name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Marathi Typing Master Setup (.exe)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Clean previous packaging output
        shell: pwsh
        run: |
          if (Test-Path release) {
            Remove-Item release -Recurse -Force
          }

      - name: Package Windows Installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = "release\MarathiTypingMasterSetup.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not created: $installer"
          }
          (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() |
            Out-File "release\MarathiTypingMasterSetup.exe.sha256" -Encoding ascii -NoNewline

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathiTypingMasterSetup-Windows
          path: |
            release/MarathiTypingMasterSetup.exe
            release/MarathiTypingMasterSetup.exe.sha256
          retention-days: 30

  release:
    name: Publish tagged Windows installer
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MarathiTypingMasterSetup-Windows
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Marathi Typing Master Desktop ${{ github.ref_name }}"
          body: "Official standalone offline desktop installer (.exe) for Marathi Typing Master (GCC-TBC 30/40 WPM)."
          files: |
            release/MarathiTypingMasterSetup.exe
            release/MarathiTypingMasterSetup.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
