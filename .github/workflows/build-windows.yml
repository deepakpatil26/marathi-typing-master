name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Marathi Typing Master Setup (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package Windows Installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production

      - name: Upload Windows Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarathiTypingMasterSetup-Windows
          path: release/*.exe
          retention-days: 30

      - name: Create GitHub Release (Direct .exe Download)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Marathi Typing Master Desktop v1.0.0"
          body: "Official standalone offline desktop installer (.exe) for Marathi Typing Master (GCC-TBC 30/40 WPM)."
          files: release/MarathiTypingMasterSetup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
