<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072431" />
      <stop offset="100%" stop-color="#021118" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#134e5e" stroke-width="4" opacity="0.6"/>
  
  <!-- Stylized Typewriter / Keyboard Base -->
  <rect x="76" y="106" width="360" height="300" rx="36" fill="#0b3142" stroke="#2dd4bf" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Keyboard Keys Preview Grid -->
  <rect x="106" y="146" width="50" height="42" rx="10" fill="#08222e" stroke="#155e75" stroke-width="2"/>
  <rect x="168" y="146" width="50" height="42" rx="10" fill="#08222e" stroke="#155e75" stroke-width="2"/>
  <rect x="230" y="146" width="50" height="42" rx="10" fill="#08222e" stroke="#155e75" stroke-width="2"/>
  <rect x="292" y="146" width="50" height="42" rx="10" fill="#08222e" stroke="#155e75" stroke-width="2"/>
  <rect x="354" y="146" width="50" height="42" rx="10" fill="#08222e" stroke="#155e75" stroke-width="2"/>

  <!-- Center Prominent Key with Devanagari 'म' -->
  <circle cx="256" cy="275" r="74" fill="url(#accentGrad)" />
  <text x="256" y="302" font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="78" font-weight="900" fill="#03151e" text-anchor="middle">म</text>

  <!-- Spacebar -->
  <rect x="156" y="360" width="200" height="24" rx="8" fill="#164e63" stroke="#2dd4bf" stroke-width="2"/>
</svg>